# Starting settings (PRD Appendix B) plus the knobs used by stages S1–S5.

limits:
  min_prompt_tokens: 20
  max_prompt_tokens: 8000

s0:                              # retrieval from uploaded documents, runs before S1 when files are attached
  store_dir: data/documents      # relative to backend/; the OPTIMUS_DOC_DIR environment variable overrides it
  max_file_mb: 25
  chunk_words: 140               # MiniLM reads at most 256 word pieces (~190 words), so chunks stay under that
  chunk_overlap_words: 30        # trailing sentences repeated at the start of the next chunk
  min_chunk_chars: 20            # shorter chunks (page numbers, stray labels) are not indexed
  max_queries: 24                # prompt sentences searched besides the whole prompt
  search_k: 20                   # nearest chunks fetched per file and query
  top_k: 6                       # most chunks passed on
  min_score: 0.35                # cosine a chunk needs before the prompt counts as being about the documents
                                 # (a prompt that points at a file, "the attached report", counts anyway)
  relative_drop: 0.15            # chunks further than this below the best score are left out
  min_query_score: 0.22          # ...except a sub-question's own best chunk, if it reaches this
  max_context_tokens: 1500       # o200k tokens of document text prepended to the prompt
  keyword_weight: 0.3            # hybrid score = (1 - w) × dense cosine + w × BM25 (scaled to the best keyword match)
  bm25: {k1: 1.5, b: 0.75}
  rerank_k: 20                   # best hybrid candidates the cross-encoder reads again
  rerank_min: 0.05               # cross-encoder relevance (0..1) a chunk needs to be passed on...
  rerank_relative: 0.25          # ...and at least this share of the best chunk's relevance
  duplicate_similarity: 0.95     # a chunk this close to one already picked adds nothing and is skipped

live:                            # real runs on Gemini and Ollama (the "chat models" set-up), measured token usage
  gemini_model: gemini-2.5-flash
  gemini_key_file: ../../chat models/key.txt   # relative to backend/; GEMINI_API_KEY overrides it
  ollama_url: http://localhost:11434
  ollama_model: llama3.2         # falls back to the first model Ollama has installed
  timeout_s: 300

s1:
  pii:
    min_score: 0.4          # Presidio scores phone numbers 0.4 without a context word
    entities: [EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, IBAN_CODE, IP_ADDRESS, US_SSN,
               US_PASSPORT, US_BANK_NUMBER, CRYPTO, PERSON, IN_AADHAAR, IN_PAN]
  injection:
    flag_at: 0.5            # combined score needed to report a span
    similarity_low: 0.45    # cosine to known attacks where the semantic signal starts
    similarity_high: 0.80   # cosine treated as a certain match
    data_boost: 0.15        # added when the text sits inside pasted data
    prose_damping: 0.75     # multiplier when it sits in the user's own instructions

s2:
  same_sentence_similarity: 0.90   # "same sentence" cut-off (Appendix B)
  lexical_overlap: 0.80            # token-set overlap of content lemmas
  lexical_min_similarity: 0.60     # ...needs at least this much semantic agreement too
  embedding_weight: 1.2            # weight of the prototype-similarity vote vs rule hits

s3:
  difficulty: {medium_at: 4.0, high_at: 8.0}
  numeric_rules_for_high_risk: 3
  answer_budget_multiplier: 1.2
  max_tokens_multiplier: 1.5
  floors:                 # minimum answer length per task type, tokens
    classify: {base: 40, per_item: 15}
    extract: 60
    qa_docs: 50
    summarise: 80
    reasoning: 100
    code: 150
    debug: 150
    plan: 150
    creative: 200
    translate: 40
    chat: 40

s4:
  low_info_percentile: 25        # phrases below this informativeness percentile are removal candidates
  surprising_top_k: 15
  weights:                       # how the per-word informativeness score is mixed
    surprisal: 0.40              # -log2 p(word | left context), GPT-2 small
    excess: 0.20                 # surprisal minus predictive entropy (surprise beyond what the LM expected)
    rarity: 0.25                 # -log2 corpus frequency (wordfreq)
    keyphrase: 0.60              # YAKE + KeyBERT salience, 0..1
    echo: -0.35                  # rare word made predictable only because it already appeared

s5:
  max_restriction_scope_tokens: 4
  compression:                   # LLMLingua-2 word removal, steered by S2 labels, S3 risk and S4 scores
    model_weight: 0.7            # LLMLingua-2 keep probability vs S4 informativeness in each word's score
    low_info_penalty: 0.6        # multiplier for words inside an S4 low-information phrase
    drop_below: 0.25             # words whose combined score is below this are unnecessary
    min_words: 4                 # parts with fewer words are kept whole
    keep_rate:                   # floor: least share of the words S4 did not flag that a part keeps, per S2 label
                                 # [least informative part, most informative part]
      role: [0.80, 1.0]
      task: [0.85, 1.0]
      question: [0.90, 1.0]
      rules: [0.90, 1.0]
      format: [0.85, 1.0]
      context: [0.50, 0.75]
    high_risk_min_rate: 1.0      # S3 high risk: least share kept (1.0 = only S2's padding/repeats go; PRD caps B at L2)
